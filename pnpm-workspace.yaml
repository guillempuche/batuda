packages:
  - 'apps/*'
  - 'packages/*'

# Flat node_modules. pnpm's default `.pnpm/<peer-deps-hash>/` paths exceed
# Unikraft's libukcpio buffer (~256 chars) and crash the unikernel at boot
# with `Failed to extract CPIO to /: -2`.
nodeLinker: hoisted

# `pnpm deploy` re-resolves transitive deps in legacy mode without honouring
# the workspace lockfile, so peer-dep transitives drift to the latest matching
# semver. The override below pins the @effect family at exact versions across
# the deploy boundary. `injectWorkspacePackages` would also fix this but
# breaks apps/internal's build (peerless workspace deps stay as unresolved
# symlinks under injection).
forceLegacyDeploy: true

# Pin @effect/* transitives so pnpm legacy deploy can't drift them across
# the workspace → /deploy boundary (`@effect/platform-node-shared` resolved
# beta.43 → beta.65 on its own, then crashed Node at `effect/dist/Context.js`
# because the older API name no longer exists in beta.43).
# INVARIANT: every entry here MUST match the `effect` / `@effect/*` version
# pinned in the workspace package.json files — bump them together, never one
# side alone. An override wins over every package.json specifier, so bumping
# only that side leaves the whole tree on the old version while every file
# claims otherwise. `pnpm check-effect-pins` is what catches it.
# `@effect/ai-openai-compat` is listed because it rides into the server
# unikernel via `@batuda/research`, so it crosses the same deploy boundary.
# `@effect/platform` and `@effect/sql` are pinned to a version that does not
# exist, on purpose. Those two names stopped at 0.97.1 and 0.52.1 — v4 folded
# them into `effect` itself — and both still ask for `effect@^3`. Nothing in the
# tree depends on them today, so the pin never resolves and never has to. If
# some future transitive drags one in, the install fails loudly here instead of
# quietly seating a v3 package next to our v4 runtime, which is the crash above.
# Do not delete these to make an install pass: find what pulled them in.
overrides:
  '@effect/platform-node-shared': 4.0.0-beta.102
  '@effect/platform-node': 4.0.0-beta.102
  '@effect/platform': 4.0.0-beta.102
  '@effect/sql-pg': 4.0.0-beta.102
  '@effect/sql': 4.0.0-beta.102
  '@effect/ai-openai-compat': 4.0.0-beta.102
  effect: 4.0.0-beta.102
  # Pin the whole @tiptap family to one version. `@tiptap/markdown` (used by
  # apps/internal's rich-text editor) is published only from 3.28.0 and needs
  # `@tiptap/core@^3.28.0`, but `@react-email/editor` pulls the rest of the
  # family at `^3.17.1`. Under the hoisted linker there can be only one
  # `@tiptap/core`, so mixing versions leaves markdown importing symbols the
  # older core doesn't export. `@react-email/editor` declares `^3.17.1`, so
  # 3.28.0 stays within its supported range.
  # INVARIANT: bump every entry together, never one alone — a split version
  # reintroduces the missing-export build failure.
  '@tiptap/core': 3.28.0
  '@tiptap/pm': 3.28.0
  '@tiptap/react': 3.28.0
  '@tiptap/starter-kit': 3.28.0
  '@tiptap/markdown': 3.28.0
  '@tiptap/extensions': 3.28.0
  '@tiptap/html': 3.28.0
  '@tiptap/suggestion': 3.28.0
  '@tiptap/extension-blockquote': 3.28.0
  '@tiptap/extension-bold': 3.28.0
  '@tiptap/extension-bubble-menu': 3.28.0
  '@tiptap/extension-bullet-list': 3.28.0
  '@tiptap/extension-code': 3.28.0
  '@tiptap/extension-code-block': 3.28.0
  '@tiptap/extension-document': 3.28.0
  '@tiptap/extension-dropcursor': 3.28.0
  '@tiptap/extension-floating-menu': 3.28.0
  '@tiptap/extension-gapcursor': 3.28.0
  '@tiptap/extension-hard-break': 3.28.0
  '@tiptap/extension-heading': 3.28.0
  '@tiptap/extension-horizontal-rule': 3.28.0
  '@tiptap/extension-italic': 3.28.0
  '@tiptap/extension-link': 3.28.0
  '@tiptap/extension-list': 3.28.0
  '@tiptap/extension-list-item': 3.28.0
  '@tiptap/extension-list-keymap': 3.28.0
  '@tiptap/extension-mention': 3.28.0
  '@tiptap/extension-ordered-list': 3.28.0
  '@tiptap/extension-paragraph': 3.28.0
  '@tiptap/extension-placeholder': 3.28.0
  '@tiptap/extension-strike': 3.28.0
  '@tiptap/extension-superscript': 3.28.0
  '@tiptap/extension-text': 3.28.0
  '@tiptap/extension-underline': 3.28.0

# Trusted install scripts; install fails on any unlisted dep with build scripts.
allowBuilds:
  '@swc/core': true
  dprint: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true
