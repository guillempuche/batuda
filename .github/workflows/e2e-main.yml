name: E2E full suite

# Post-merge backstop: the whole browser suite on every push to main. This is
# NOT a required check and does NOT run on pull requests — it reports a break on
# the commit without gating review. The PR gate is the `e2e-smoke` job in
# ci.yml; this catches whatever the smoke subset doesn't (docs/runbooks.md).
on:
  push:
    branches: [main]
    # Release commits only bump a changelog and a version — nothing the browser
    # can exercise, and worse: a newer push cancels the run underneath it
    # (below), so four release commits in a row used to cancel the run for the
    # real commit they were releasing. `paths-ignore` stops the run being
    # created at all; a job-level `if` cannot, because a run joins the
    # concurrency group before any job condition is read.
    #
    # A dependency change still runs — it also moves pnpm-lock.yaml.
    paths-ignore:
      - "**/CHANGELOG.md"
      - "**/package.json"

# A newer push supersedes an in-flight full run — the latest commit is what
# matters for a post-merge backstop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-full:
    name: E2E full suite (Playwright)
    runs-on: ubuntu-latest
    # The full 34-spec suite runs sequentially (workers: 1); ~6 min of tests on
    # top of setup, so 20 leaves comfortable headroom.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # with-mail brings up GreenMail + the mail-worker so the email round-trip
      # specs (send, reply, bounce, magic-link, …) run; no grep = the full suite.
      - name: Stand up the stack and run the full suite
        uses: ./.github/actions/e2e-stack
        with:
          with-mail: "true"

  # The pull-request gate runs the integration suite against the merge GitHub
  # builds from the branch and main. That answers "does this change work", not
  # "does main work": two pull requests can each be green on their own merge and
  # red once both have landed, and nothing looked at main afterwards. This does.
  #
  # A backstop rather than a gate — it cannot block a merge that already
  # happened, and its job is to name the commit that broke main while the change
  # is still fresh in somebody's head.
  integration-main:
    name: Integration suite (post-merge)
    runs-on: ubuntu-latest
    # The suite takes ~2 minutes; the rest is pulling images, migrating and
    # seeding. Matches the pull-request gate's own budget for the same work.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The integration suite imports several workspace packages from their
      # built `dist/`, the same way the dev server does.
      - name: Build
        run: pnpm build

      - name: Integration suite against a local Postgres
        uses: ./.github/actions/integration-db
