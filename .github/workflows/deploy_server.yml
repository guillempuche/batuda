name: Deploy Server

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      force_migrate:
        description: "Apply pending prod migrations even when none are newly detected, then skip the redeploy. For a migration that missed its deploy, or a re-run after a partial failure. Still gated by the production-db reviewer."
        type: boolean
        default: false

concurrency:
  group: deploy-server
  cancel-in-progress: false

# Least privilege: deploy authenticates to Unikraft Cloud via secrets, not the
# GitHub token. It only needs to read the repo.
permissions:
  contents: read

env:
  KRAFTCLOUD_METRO: fra
  # Pinned new Unikraft CLI (`unikraft`, from unikraft-cloud/cli) version.
  # Bump deliberately after verifying a new release against a dry-run deploy.
  UNIKRAFT_CLI_VERSION: "0.4.1"
  # Image namespace on Unikraft Cloud is the organization slug; published
  # images and running instances live under `<org>/<name>`.
  KRAFTCLOUD_ORG: gaaaa

jobs:
  # Detect whether this release adds any new migrations. The gated migrate job
  # below runs ONLY when it does, so a routine deploy with no schema change
  # skips the human approval and ships straight away. (CI's
  # check-migration-safety.mjs already ensures any migration reaching here is
  # backward-compatible or a deliberate, documented expand-contract change.)
  detect-migrations:
    name: Detect pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_migrations: ${{ steps.detect.outputs.has_migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Tags + full history so we can diff migrations since the last release.
          fetch-depth: 0

      - name: Detect new migrations since the previous release
        id: detect
        env:
          FORCE_MIGRATE: ${{ inputs.force_migrate }}
        run: |
          # A manual force_migrate dispatch runs the gated migrate even when no
          # new migration is detected — for a migration that missed its deploy,
          # or a re-run after a partial failure. The migrator is incremental, so
          # it applies only what is still pending.
          if [ "$FORCE_MIGRATE" = "true" ]; then
            echo "force_migrate requested — gating the migrate."
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # New migration files between the previous server-v* tag and this one.
          # When there's no previous tag (first deploy) we gate, to be safe.
          prev=$(git describe --tags --match='server-v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$prev" ]; then
            echo "No previous server tag found — gating the migrate to be safe."
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Our own migrations are TypeScript (Effect SqlClient), named NNNN_*.ts —
          # not .sql, so the old '\.sql$' filter matched nothing and silently
          # skipped every migrate.
          files=$(git diff --name-only "$prev..HEAD" -- apps/server/src/db/migrations/ | grep -E '[0-9]{4}_.*\.(ts|sql)$' || true)

          # Better Auth owns its own tables and generates their DDL at migrate
          # time from the config it is handed — there is no file under
          # migrations/ to notice. So a release that adds, say, a column to the
          # user table changes no migration file at all, and a path-only check
          # waves it through to a deploy whose code expects a column that does
          # not exist yet.
          #
          # Its schema comes from the plugin list and the additionalFields on
          # user/session/account/verification (see `getAuthTables`), all of
          # which reach the generator through migrate.ts, with the shared config
          # mirroring them for the running server. Watch both.
          ba_config=$(git diff --name-only "$prev..HEAD" -- \
            apps/server/src/db/migrate.ts \
            packages/auth/src/infrastructure/build-better-auth-config.ts || true)

          # A Better Auth upgrade can add columns of its own without anyone here
          # touching a config file, so a version change gates too.
          ba_version=$(git diff "$prev..HEAD" -- '*package.json' \
            | grep -E '^[+-][[:space:]]*"(better-auth|@better-auth/[a-z-]+)":' || true)

          if [ -n "$files" ] || [ -n "$ba_config" ] || [ -n "$ba_version" ]; then
            [ -n "$files" ] && { echo "New migrations since $prev:"; echo "$files"; }
            [ -n "$ba_config" ] && { echo "Better Auth schema config changed since $prev:"; echo "$ba_config"; }
            [ -n "$ba_version" ] && { echo "Better Auth version changed since $prev:"; echo "$ba_version"; }
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new migrations since $prev — skipping the migrate gate."
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi

  # Apply pending migrations before the deploy, gated by a required reviewer on
  # the production-db environment — a one-click human checkpoint before any prod
  # schema change. Runs ONLY when detect-migrations found new migration files,
  # so routine no-migration releases need no approval. Migrations must stay
  # backward-compatible with the still-running version (docs/runbooks.md).
  migrate:
    name: Migrate prod database
    needs: detect-migrations
    if: ${{ needs.detect-migrations.outputs.has_migrations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `production-db` gates this job with a required reviewer; its
    # MIGRATION_DATABASE_URL secret must be set on this environment.
    environment: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        # Migrations need a SEPARATE connection from the runtime DATABASE_URL:
        # the schema owner `neondb_owner` (the runtime `app_service` role can't
        # run the DDL + REVOKE/GRANT the migrations issue), over the direct
        # (unpooled) endpoint (the pooler breaks migration locks). migrate.ts
        # refuses a pooled host outright.
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm db:migrate

  deploy:
    name: Deploy to Unikraft Cloud
    needs: [detect-migrations, migrate]
    # Deploy when migrate succeeded OR was skipped (no new migrations); block
    # only if detection failed or the migration itself failed. A force_migrate
    # dispatch is migrate-only — it skips the redeploy (the running version is
    # unchanged), so a branch dispatch never ships branch code to prod.
    if: ${{ !cancelled() && needs.detect-migrations.result == 'success' && needs.migrate.result != 'failure' && !inputs.force_migrate }}
    runs-on: ubuntu-latest
    # The image now builds once in its own step (below); an uncached build is
    # the long pole, so keep a generous ceiling until build caching lands.
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare files for Unikraft Cloud
        run: |
          cp apps/server/Kraftfile Kraftfile
          cp apps/server/Dockerfile Dockerfile

      # Installs the `unikraft` CLI and logs it in headlessly. The new CLI keeps
      # its own auth store (a legacy `kraft`/UKC_TOKEN login does not carry
      # over), so every deploy authenticates here via the org token.
      - name: Install and log in to Unikraft Cloud
        uses: unikraft/setup-action@29c9cce5bc7e894f8929c845d4fba518ef8f1015 # v1
        with:
          version: ${{ env.UNIKRAFT_CLI_VERSION }}
          token: ${{ secrets.KRAFTCLOUD_TOKEN }}
          organization: ${{ env.KRAFTCLOUD_ORG }}

      - name: Extract version from tag
        id: meta
        run: |
          if [[ "$GITHUB_REF_NAME" == server-v* ]]; then
            echo "version=${GITHUB_REF_NAME#server-v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(node -p "require('./apps/server/package.json').version")" >> $GITHUB_OUTPUT
          fi
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Build and publish the image ONCE. The new CLI separates packaging from
      # running, so the deploy step below only re-runs the fast `unikraft run`
      # on retry — never a fresh ~9-min image build (the old kraftkit path
      # rebuilt on every retry and ran out of each attempt's window). The build
      # (~9-min compile + ~300 MiB push) has no tight deadline of its own; the
      # job's timeout-minutes is its single ceiling, so a slow uncached build
      # isn't killed by a second, shorter clock.
      - name: Build and publish image
        run: |
          unikraft build . \
            --output ${{ env.KRAFTCLOUD_ORG }}/batuda-server:${{ steps.meta.outputs.version }}

      # The service (load balancer) owns the domain + ports and persists across
      # releases; instances are attached to it. It already exists in prod, so
      # this is an idempotent safety net for a from-scratch environment.
      - name: Ensure Unikraft Cloud service exists
        run: |
          # Read for what the CLI printed, not for how it exited: it asks every
          # metro and reports failure when any of them is unwell, even though
          # the one being deployed to answered perfectly. Going by the exit
          # code, an outage in another metro sends this down the else branch
          # and the deploy dies creating a service that already exists
          # (2026-08-31). The filter keeps the answer to this metro, so a
          # service of the same name elsewhere cannot stand in for it.
          if unikraft services list \
               --filter 'metro=="${{ env.KRAFTCLOUD_METRO }}"' \
               -f name -o quiet 2>/dev/null | grep -qx batuda-server; then
            echo "Service batuda-server already exists"
          else
            echo "Creating service batuda-server"
            # "Already exists" is the state we want, so it is not a failure —
            # which keeps this step safe to rerun even when the check above got
            # no answer at all and sent us here. Any other failure still stops
            # the deploy.
            if ! unikraft services create \
                   --name batuda-server \
                   --metro ${{ env.KRAFTCLOUD_METRO }} \
                   --domains api.batuda.co \
                   --services 443:3000/tls+http \
                   --services 80:443/http+redirect >/tmp/svc-create.log 2>&1; then
              cat /tmp/svc-create.log
              grep -q "already exists" /tmp/svc-create.log
            fi
          fi

      - name: Pre-flight cmdline size guard
        run: |
          # Unikraft Cloud bakes every -e var into the unikernel kernel command
          # line, which Unikraft caps at 4096 bytes / 60 args: past the byte
          # cap the boot aborts with -E2BIG, past the arg cap argv is silently
          # truncated and vars vanish at runtime. Assemble the exact -e payload
          # this deploy will send and fail well under both ceilings, so an
          # oversized release is caught here instead of at boot. Non-secret
          # config ships in the baked file and is not counted. Secret values
          # stay inside the array and are never printed.
          E_ARGS=(
            -e NODE_ENV=production
            -e PORT=3000
            -e SERVICE_VERSION="${{ steps.meta.outputs.version }}"
            -e GIT_SHA="${{ github.sha }}"
            -e REGION="${{ env.KRAFTCLOUD_METRO }}"
            -e OTEL_EXPORTER_OTLP_HEADERS="${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }},x-honeycomb-dataset=batuda-server"
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}"
            -e BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}"
            -e STORAGE_ACCESS_KEY_ID="${{ secrets.STORAGE_ACCESS_KEY_ID }}"
            -e STORAGE_SECRET_ACCESS_KEY="${{ secrets.STORAGE_SECRET_ACCESS_KEY }}"
            -e EMAIL_CREDENTIAL_KEY="${{ secrets.EMAIL_CREDENTIAL_KEY }}"
            -e EMAIL_API_KEY_TRANSACTIONAL="${{ secrets.EMAIL_API_KEY_TRANSACTIONAL }}"
            -e CALENDAR_API_KEY="${{ secrets.CALENDAR_API_KEY }}"
            -e CALENDAR_WEBHOOK_SECRET="${{ secrets.CALENDAR_WEBHOOK_SECRET }}"
            -e RESEARCH_LLM_AGENT_API_KEY="${{ secrets.RESEARCH_LLM_AGENT_API_KEY }}"
            -e RESEARCH_LLM_AGENT_API_KEY_2="${{ secrets.RESEARCH_LLM_AGENT_API_KEY_2 }}"
            -e RESEARCH_LLM_EXTRACT_API_KEY="${{ secrets.RESEARCH_LLM_EXTRACT_API_KEY }}"
            -e RESEARCH_LLM_EXTRACT_API_KEY_2="${{ secrets.RESEARCH_LLM_EXTRACT_API_KEY_2 }}"
            -e RESEARCH_LLM_WRITER_API_KEY="${{ secrets.RESEARCH_LLM_WRITER_API_KEY }}"
            -e RESEARCH_LLM_WRITER_API_KEY_2="${{ secrets.RESEARCH_LLM_WRITER_API_KEY_2 }}"
            -e RESEARCH_API_KEY_SEARCH="${{ secrets.RESEARCH_API_KEY_SEARCH }}"
            -e RESEARCH_API_KEY_SEARCH_2="${{ secrets.RESEARCH_API_KEY_SEARCH_2 }}"
            -e RESEARCH_API_KEY_SCRAPE="${{ secrets.RESEARCH_API_KEY_SCRAPE }}"
            -e RESEARCH_API_KEY_REGISTRY_ES="${{ secrets.RESEARCH_API_KEY_REGISTRY_ES }}"
            -e RESEARCH_API_KEY_ENRICH="${{ secrets.RESEARCH_API_KEY_ENRICH }}"
            -e RESEARCH_API_KEY_ENRICH_2="${{ secrets.RESEARCH_API_KEY_ENRICH_2 }}"
            -e RESEARCH_API_KEY_VERIFY="${{ secrets.RESEARCH_API_KEY_VERIFY }}"
            -e RESEARCH_API_KEY_REGISTRY_GB="${{ secrets.RESEARCH_API_KEY_REGISTRY_GB }}"
          )
          BYTES=$(printf '%s' "${E_ARGS[*]}" | wc -c | tr -d ' ')
          FLAGS=0
          for tok in "${E_ARGS[@]}"; do
            if [ "$tok" = "-e" ]; then
              FLAGS=$((FLAGS + 1))
            fi
          done
          echo "Assembled -e payload: ${BYTES} bytes across ${FLAGS} -e flags (limits: 3500 bytes / 50 flags)"
          if [ "$BYTES" -gt 3500 ] || [ "$FLAGS" -gt 50 ]; then
            echo "::error::cmdline -e payload is ${BYTES} bytes / ${FLAGS} flags, over the pre-flight limit of 3500 bytes / 50 flags; move non-secret config into apps/server/config.production.json"
            exit 1
          fi

      - name: Deploy to Unikraft Cloud
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          #   --timeout 5m gives the deploy up to 5 minutes to wait for the
          #     freshly-pushed ~300 MiB image to become available before the
          #     instance is created — the Unikraft team's guidance for the
          #     propagation delay. The new CLI's --timeout is a whole-command
          #     deadline that takes a real duration; the old kraftkit API
          #     capped per-RPC timeouts at 10s (HTTP 400 above 10000ms).
          #   --service batuda-server attaches the instance to the existing
          #     load balancer that owns api.batuda.co + the ports; do NOT pass
          #     -p/--domain here (the service owns them).
          #   --name batuda-server-<sha> is unique per release so retries and
          #     future deploys never collide on the name.
          #   -m 2048M: pnpm v11 hoisted deploy ships apps/server's full install
          #     tree (~303 MB); 1024 ran out of initrd RAM extracting the CPIO.
          #   --restart on-failure: if the process crashes (non-zero exit) the
          #     platform starts a fresh instance instead of leaving a dead-but-
          #     "running" box. A clean shutdown (exit 0) is left alone. Pairs
          #     with the process crash-guards in main.ts.
          #   Scale-to-zero stays off via the Kraftfile label (baked in).
          command: |
            # No users yet, so a brief gap is fine: remove every current
            # batuda-server instance (the old release, plus any half-created one
            # from a failed retry) so the new instance is the sole member of the
            # service and the /health check below unambiguously tests this
            # release. -f name -o quiet prints only names — never the instance
            # env, which the API returns in cleartext.
            # instances list/delete take a bare name and reject --metro (only
            # run/services create accept it); the login profile spans metros.
            for old in $(unikraft instances list --filter 'image~="${{ env.KRAFTCLOUD_ORG }}/batuda-server"' -f name -o quiet); do
              unikraft instances delete "$old" 2>&1 | grep -v "not found" || true
            done
            unikraft run \
              --timeout 5m \
              --metro ${{ env.KRAFTCLOUD_METRO }} \
              --service batuda-server \
              --name batuda-server-${{ steps.meta.outputs.short_sha }} \
              --image ${{ env.KRAFTCLOUD_ORG }}/batuda-server:${{ steps.meta.outputs.version }} \
              -m 2048M \
              --restart on-failure \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e SERVICE_VERSION="${{ steps.meta.outputs.version }}" \
              -e GIT_SHA="${{ github.sha }}" \
              -e REGION="${{ env.KRAFTCLOUD_METRO }}" \
              -e OTEL_EXPORTER_OTLP_HEADERS="${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }},x-honeycomb-dataset=batuda-server" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
              -e STORAGE_ACCESS_KEY_ID="${{ secrets.STORAGE_ACCESS_KEY_ID }}" \
              -e STORAGE_SECRET_ACCESS_KEY="${{ secrets.STORAGE_SECRET_ACCESS_KEY }}" \
              -e EMAIL_CREDENTIAL_KEY="${{ secrets.EMAIL_CREDENTIAL_KEY }}" \
              -e EMAIL_API_KEY_TRANSACTIONAL="${{ secrets.EMAIL_API_KEY_TRANSACTIONAL }}" \
              -e CALENDAR_API_KEY="${{ secrets.CALENDAR_API_KEY }}" \
              -e CALENDAR_WEBHOOK_SECRET="${{ secrets.CALENDAR_WEBHOOK_SECRET }}" \
              -e RESEARCH_LLM_AGENT_API_KEY="${{ secrets.RESEARCH_LLM_AGENT_API_KEY }}" \
              -e RESEARCH_LLM_AGENT_API_KEY_2="${{ secrets.RESEARCH_LLM_AGENT_API_KEY_2 }}" \
              -e RESEARCH_LLM_EXTRACT_API_KEY="${{ secrets.RESEARCH_LLM_EXTRACT_API_KEY }}" \
              -e RESEARCH_LLM_EXTRACT_API_KEY_2="${{ secrets.RESEARCH_LLM_EXTRACT_API_KEY_2 }}" \
              -e RESEARCH_LLM_WRITER_API_KEY="${{ secrets.RESEARCH_LLM_WRITER_API_KEY }}" \
              -e RESEARCH_LLM_WRITER_API_KEY_2="${{ secrets.RESEARCH_LLM_WRITER_API_KEY_2 }}" \
              -e RESEARCH_API_KEY_SEARCH="${{ secrets.RESEARCH_API_KEY_SEARCH }}" \
              -e RESEARCH_API_KEY_SEARCH_2="${{ secrets.RESEARCH_API_KEY_SEARCH_2 }}" \
              -e RESEARCH_API_KEY_SCRAPE="${{ secrets.RESEARCH_API_KEY_SCRAPE }}" \
              -e RESEARCH_API_KEY_REGISTRY_ES="${{ secrets.RESEARCH_API_KEY_REGISTRY_ES }}" \
              -e RESEARCH_API_KEY_ENRICH="${{ secrets.RESEARCH_API_KEY_ENRICH }}" \
              -e RESEARCH_API_KEY_ENRICH_2="${{ secrets.RESEARCH_API_KEY_ENRICH_2 }}" \
              -e RESEARCH_API_KEY_VERIFY="${{ secrets.RESEARCH_API_KEY_VERIFY }}" \
              -e RESEARCH_API_KEY_REGISTRY_GB="${{ secrets.RESEARCH_API_KEY_REGISTRY_GB }}"

      - name: Verify deployment
        run: |
          sleep 5
          unikraft instances list --filter 'image~="${{ env.KRAFTCLOUD_ORG }}/batuda-server"' -f name,state -o table || true
          # Gate the deploy on /health actually serving. curl already retries
          # to absorb cold-boot latency; fail the job if it never comes up so a
          # broken release doesn't pass with only a warning.
          if curl --retry 5 --retry-delay 5 --retry-all-errors -sf https://api.batuda.co/health -o /dev/null; then
            echo "Health check passed"
          else
            echo "::error::Health check failed after deploy"
            exit 1
          fi

      # Every release publishes a ~430 MiB image, and for a long time nothing
      # removed the old ones. The registry filled to its 10 GiB ceiling and a
      # push then failed outright ("403 Forbidden ... will exceed the
      # configured upper limit"), which fails the release. Keep the last few
      # versions so a rollback still has an image to return to, and drop the
      # rest.
      #
      # The storage ceiling is shared with every other image in the
      # organization, so this keeps our own history bounded but cannot on its
      # own guarantee there is room: a push can still be refused because
      # something else grew.
      #
      # Never fails the release. The deploy and its health check have already
      # passed by this point, so tidying that could not run is a warning, not a
      # bad release.
      - name: Prune old images
        continue-on-error: true
        run: |
          set -u
          REPO="${{ env.KRAFTCLOUD_ORG }}/batuda-server"
          # The version this run just put live and proved healthy. Asking the
          # platform which image an instance runs does not work here: it
          # answers with the name alone, no version, so it cannot say which of
          # them is live.
          DEPLOYED="$REPO:${{ steps.meta.outputs.version }}"
          KEEP=3

          # The trailing colon keeps the untagged `<repo>` entry out of the
          # list — it is a separate image that no release publishes. The same
          # image is reported once per metro, hence the de-duplication.
          all=$(unikraft images list -o json 2>/dev/null \
            | jq -r --arg prefix "$REPO:" '.[] | (.ref // "") | select(startswith($prefix))' \
            | sort -u)
          if [ -z "$all" ]; then
            echo "::warning::The image list came back empty, so nothing was pruned."
            exit 0
          fi

          # Keep the newest few, and always keep what this run put live. A
          # rollback re-deploys an older version, which by number alone looks
          # stale and would otherwise be deleted moments after going live.
          # `sort -V` orders these dated names properly, so 2026.7.9 comes
          # before 2026.7.10 and a same-day patch comes after what it patches.
          keep=$({ printf '%s\n' "$all" | sort -Vr | head -n "$KEEP"; printf '%s\n' "$DEPLOYED"; } | sort -u)
          echo "Keeping:"
          printf '%s\n' "$keep" | sed 's/^/  /'

          comm -23 <(printf '%s\n' "$all") <(printf '%s\n' "$keep") | while read -r ref; do
            echo "  deleting $ref"
            unikraft images delete "$ref" || echo "::warning::Could not delete $ref"
          done
