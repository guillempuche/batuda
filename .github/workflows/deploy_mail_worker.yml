name: Deploy Mail-worker

on:
  push:
    tags:
      - "mail-worker-v*"
  workflow_dispatch:

concurrency:
  group: deploy-mail-worker
  cancel-in-progress: false

# Least privilege: deploy authenticates to Unikraft Cloud via secrets, not the
# GitHub token. It only needs to read the repo.
permissions:
  contents: read

env:
  KRAFTCLOUD_METRO: fra
  # Pinned new Unikraft CLI (`unikraft`, from unikraft-cloud/cli) version.
  # Bump deliberately after verifying a new release against a dry-run
  # deploy; run it with dummy values, since it prints every variable it
  # would send. 0.5 is the floor — below it, `-e` cuts its own value at
  # every comma.
  UNIKRAFT_CLI_VERSION: "0.5.1"
  # Image namespace on Unikraft Cloud is the organization slug; published
  # images and running instances live under `<org>/<name>`.
  KRAFTCLOUD_ORG: gaaaa

jobs:
  deploy:
    name: Deploy to Unikraft Cloud
    runs-on: ubuntu-latest
    # The image now builds once in its own step (below); an uncached build is
    # the long pole, so keep a generous ceiling until build caching lands.
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare files for Unikraft Cloud
        run: |
          cp apps/mail-worker/Kraftfile Kraftfile
          cp apps/mail-worker/Dockerfile Dockerfile

      # Installs the `unikraft` CLI and logs it in headlessly. The new CLI keeps
      # its own auth store (a legacy `kraft`/UKC_TOKEN login does not carry
      # over), so every deploy authenticates here via the org token.
      - name: Install and log in to Unikraft Cloud
        uses: unikraft/setup-action@29c9cce5bc7e894f8929c845d4fba518ef8f1015 # v1
        with:
          version: ${{ env.UNIKRAFT_CLI_VERSION }}
          token: ${{ secrets.KRAFTCLOUD_TOKEN }}
          organization: ${{ env.KRAFTCLOUD_ORG }}

      - name: Extract version from tag
        id: meta
        run: |
          if [[ "$GITHUB_REF_NAME" == mail-worker-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mail-worker-v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(node -p "require('./apps/mail-worker/package.json').version")" >> $GITHUB_OUTPUT
          fi
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Build and publish the image ONCE. The new CLI separates packaging from
      # running, so the deploy step below only re-runs the fast `unikraft run`
      # on retry — never a fresh ~9-min image build (the old kraftkit path
      # rebuilt on every retry and ran out of each attempt's window). The build
      # (~9-min compile + ~300 MiB push) has no tight deadline of its own; the
      # job's timeout-minutes is its single ceiling, so a slow uncached build
      # isn't killed by a second, shorter clock.
      - name: Build and publish image
        run: |
          unikraft build . \
            --output ${{ env.KRAFTCLOUD_ORG }}/batuda-mail-worker:${{ steps.meta.outputs.version }}

      - name: Pre-flight cmdline size guard
        env:
          OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          # The dataset name is appended to the secret, so the value carries a
          # comma — and below CLI 0.5, the -e flag cut its value at every
          # comma. That left both instances holding the team key alone, with
          # the dataset arriving as a separate variable nothing reads, so
          # every metric was filed under one shared dataset (blamed on a
          # stray newline on 2026-09-01). Line breaks are stripped all the
          # same: the secret is read from the environment rather than pasted
          # into the command, and one at its end would land mid-value.
          headers="$(printf '%s' "$OTLP_HEADERS" | tr -d '\r\n'),x-honeycomb-dataset=batuda-mail-worker"

          # Unikraft Cloud bakes every -e var into the unikernel kernel command
          # line, which Unikraft caps at 4096 bytes / 60 args: past the byte
          # cap the boot aborts with -E2BIG, past the arg cap argv is silently
          # truncated and vars vanish at runtime. Assemble the exact -e payload
          # this deploy will send and fail well under both ceilings, so an
          # oversized release is caught here instead of at boot. Non-secret
          # config ships in the baked file and is not counted. Secret values
          # stay inside the array and are never printed.
          E_ARGS=(
            -e NODE_ENV=production
            -e SERVICE_VERSION="${{ steps.meta.outputs.version }}"
            -e GIT_SHA="${{ github.sha }}"
            -e REGION="${{ env.KRAFTCLOUD_METRO }}"
            -e OTEL_EXPORTER_OTLP_HEADERS="$headers"
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}"
            -e EMAIL_CREDENTIAL_KEY="${{ secrets.EMAIL_CREDENTIAL_KEY }}"
            -e STORAGE_ACCESS_KEY_ID="${{ secrets.STORAGE_ACCESS_KEY_ID }}"
            -e STORAGE_SECRET_ACCESS_KEY="${{ secrets.STORAGE_SECRET_ACCESS_KEY }}"
          )
          BYTES=$(printf '%s' "${E_ARGS[*]}" | wc -c | tr -d ' ')
          FLAGS=0
          for tok in "${E_ARGS[@]}"; do
            if [ "$tok" = "-e" ]; then
              FLAGS=$((FLAGS + 1))
            fi
          done
          echo "Assembled -e payload: ${BYTES} bytes across ${FLAGS} -e flags (limits: 3500 bytes / 50 flags)"
          if [ "$BYTES" -gt 3500 ] || [ "$FLAGS" -gt 50 ]; then
            echo "::error::cmdline -e payload is ${BYTES} bytes / ${FLAGS} flags, over the pre-flight limit of 3500 bytes / 50 flags; move non-secret config into apps/mail-worker/config.production.json"
            exit 1
          fi

      - name: Deploy to Unikraft Cloud
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          # Background worker — no public HTTP endpoint, so no service group.
          # Use a stable instance name (`batuda-mail-worker`, mirroring the
          # batuda-server / batuda-web naming) so ops commands target a
          # predictable identity. The IMAP IDLE connections drop on any
          # restart and the worker's claim-and-reconnect loop re-establishes
          # them, so a ~5s gap between delete + recreate is acceptable.
          #   Each retry first deletes any leftover instance so the fixed name
          #     is free before `run` recreates it (a half-created instance from
          #     a failed attempt would otherwise collide on the name).
          #   -m 2048M mirrors server's footprint; the deploy tree (aws-sdk +
          #     imapflow + mailparser + pg + effect) is comparable. 1024 ran
          #     out of initrd RAM extracting the CPIO.
          #   --restart on-failure: if the worker crashes (non-zero exit), the
          #     platform starts a fresh one instead of leaving it dead but still
          #     listed as "running" and processing no mail. A clean shutdown
          #     (exit 0) is left alone. Pairs with the crash-guards in main.ts.
          #   --timeout 5m gives the deploy up to 5 minutes to wait for the
          #     freshly-pushed ~300 MiB image to become available before the
          #     instance is created — the Unikraft team's guidance for the
          #     propagation delay. The new CLI's --timeout is a whole-command
          #     deadline that takes a real duration; the old kraftkit API
          #     capped per-RPC timeouts at 10s (HTTP 400 above 10000ms).
          #   Scale-to-zero stays off via the Kraftfile label (baked into the
          #     image), keeping the IDLE-holding worker always-warm.
          command: |
            # Line breaks stripped before the dataset name is appended: one at
            # the end of the secret would land mid-value. The comma this adds
            # only survives on CLI 0.5 and up; older ones split the value here
            # and the dataset never reached the instance.
            headers="$(printf '%s' "$OTLP_HEADERS" | tr -d '\r\n'),x-honeycomb-dataset=batuda-mail-worker"

            # instances delete/get/logs take a bare name and reject --metro
            # (only run/services create accept it); the login profile spans metros.
            unikraft instances delete batuda-mail-worker 2>&1 | grep -v "not found" || true

            # Confirm the name is really free instead of trusting the delete.
            # The CLI asks every metro and reports failure when any of them is
            # unwell, so an outage somewhere else can leave the old instance
            # standing while the delete still looks like it worked — `run` then
            # collides on the name and the deploy dies three attempts later
            # saying nothing about the real cause (2026-08-31). `list` is read
            # for what it printed, not for how it exited.
            for _ in 1 2 3 4 5; do
              unikraft instances list --filter 'name=="batuda-mail-worker"' \
                -f name -o quiet 2>/dev/null | grep -qx batuda-mail-worker || break
              sleep 3
              unikraft instances delete batuda-mail-worker >/dev/null 2>&1 || true
            done
            if unikraft instances list --filter 'name=="batuda-mail-worker"' \
                 -f name -o quiet 2>/dev/null | grep -qx batuda-mail-worker; then
              echo "::error::batuda-mail-worker is still there after repeated deletes. Check https://status.unikraft.com/ — a metro being down makes every CLI call fail, including ones aimed elsewhere."
              exit 1
            fi
            unikraft run \
              --timeout 5m \
              --metro ${{ env.KRAFTCLOUD_METRO }} \
              --name batuda-mail-worker \
              --image ${{ env.KRAFTCLOUD_ORG }}/batuda-mail-worker:${{ steps.meta.outputs.version }} \
              -m 2048M \
              --restart on-failure \
              -e NODE_ENV=production \
              -e SERVICE_VERSION="${{ steps.meta.outputs.version }}" \
              -e GIT_SHA="${{ github.sha }}" \
              -e REGION="${{ env.KRAFTCLOUD_METRO }}" \
              -e OTEL_EXPORTER_OTLP_HEADERS="$headers" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e EMAIL_CREDENTIAL_KEY="${{ secrets.EMAIL_CREDENTIAL_KEY }}" \
              -e STORAGE_ACCESS_KEY_ID="${{ secrets.STORAGE_ACCESS_KEY_ID }}" \
              -e STORAGE_SECRET_ACCESS_KEY="${{ secrets.STORAGE_SECRET_ACCESS_KEY }}" \
              -f name,state

      - name: Verify deployment
        run: |
          sleep 5
          # Read without -f, this prints the instance's entire environment in
          # clear text, so name only the fields wanted. The worker serves no
          # HTTP, so there is no /health to curl: this state is the only thing
          # standing between a crash-looping worker and a green deploy. It
          # reads `starting` for a few seconds after boot (~6 s on 2026-09-15),
          # so give it a little while to settle.
          worker_state=""
          for _ in 1 2 3 4 5 6; do
            worker_state="$(unikraft instances get batuda-mail-worker -f name,state -o table 2>/dev/null || true)"
            if printf '%s' "$worker_state" | grep -q running; then break; fi
            sleep 5
          done
          printf '%s\n' "$worker_state"
          if [ -z "$worker_state" ]; then
            echo "::warning::Could not read the instance's state after the deploy"
          elif ! printf '%s' "$worker_state" | grep -q running; then
            echo "::error::batuda-mail-worker is not running after the deploy"
            exit 1
          fi

          # Confirm the dataset name reached the running instance, and that it
          # sits inside the header value rather than split into a variable of
          # its own: a value cut at its comma still carries the header's name,
          # so a search for that name alone would not catch it. Nothing read
          # here is ever printed.
          instance_env="$(unikraft instances get batuda-mail-worker \
                            -f runtime.env -o json 2>/dev/null || true)"
          # Coming back empty means the read did not happen, which is not the
          # same as the header being wrong: asking by name makes the CLI ask
          # every metro, and one being unwell somewhere else is enough to sink
          # the whole answer (2026-08-31). Say so and carry on; only a header
          # actually seen to be wrong stops the job.
          if [ -z "$instance_env" ]; then
            echo "::warning::Could not read the instance's environment, so the telemetry header went unchecked"
          else
            # A variable of its own is the fingerprint of a value cut at its
            # comma, whatever shape the read comes back in; inside the header
            # value the name always follows one.
            if printf '%s' "$instance_env" | grep -q '"x-honeycomb-dataset'; then
              echo "::error::x-honeycomb-dataset arrived as a variable of its own, so OTEL_EXPORTER_OTLP_HEADERS was cut at its comma; check the pinned Unikraft CLI version"
              exit 1
            fi
            if ! printf '%s' "$instance_env" | grep -q ',x-honeycomb-dataset=batuda-mail-worker'; then
              echo "::error::x-honeycomb-dataset is missing from OTEL_EXPORTER_OTLP_HEADERS on the running instance; metrics would be filed under a shared default dataset instead of batuda-mail-worker"
              exit 1
            fi
          fi
          # The worker's console is deliberately not read here. Asking for it by
          # name makes the CLI ask every metro and fail over the ones the
          # instance is not in, so it has never once returned a line (checked
          # back to 2026-09-08); and were it ever to work, those lines name
          # mailboxes and carry provider errors, which are nobody's repository
          # secret and so would reach the job log unmasked. The state read above
          # is what says the instance is up.

      # Every release publishes a ~430 MiB image, and for a long time nothing
      # removed the old ones. The registry filled to its 10 GiB ceiling and a
      # push then failed outright ("403 Forbidden ... will exceed the
      # configured upper limit"), which fails the release. Keep the last few
      # versions so a rollback still has an image to return to, and drop the
      # rest.
      #
      # The storage ceiling is shared with every other image in the
      # organization, so this keeps our own history bounded but cannot on its
      # own guarantee there is room: a push can still be refused because
      # something else grew.
      #
      # Never fails the release. The deploy has already succeeded by this
      # point, so tidying that could not run is a warning, not a bad release.
      - name: Prune old images
        continue-on-error: true
        run: |
          set -u
          REPO="${{ env.KRAFTCLOUD_ORG }}/batuda-mail-worker"
          # The version this run just put live. Asking the platform which image
          # an instance runs does not work here: it answers with the name
          # alone, no version, so it cannot say which of them is live.
          DEPLOYED="$REPO:${{ steps.meta.outputs.version }}"
          KEEP=3

          # The trailing colon keeps the untagged `<repo>` entry out of the
          # list — it is a separate image that no release publishes. The same
          # image is reported once per metro, hence the de-duplication.
          all=$(unikraft images list -o json 2>/dev/null \
            | jq -r --arg prefix "$REPO:" '.[] | (.ref // "") | select(startswith($prefix))' \
            | sort -u)
          if [ -z "$all" ]; then
            echo "::warning::The image list came back empty, so nothing was pruned."
            exit 0
          fi

          # Keep the newest few, and always keep what this run put live. A
          # rollback re-deploys an older version, which by number alone looks
          # stale and would otherwise be deleted moments after going live.
          # `sort -V` orders these dated names properly, so 2026.7.9 comes
          # before 2026.7.10 and a same-day patch comes after what it patches.
          keep=$({ printf '%s\n' "$all" | sort -Vr | head -n "$KEEP"; printf '%s\n' "$DEPLOYED"; } | sort -u)
          echo "Keeping:"
          printf '%s\n' "$keep" | sed 's/^/  /'

          comm -23 <(printf '%s\n' "$all") <(printf '%s\n' "$keep") | while read -r ref; do
            echo "  deleting $ref"
            unikraft images delete "$ref" || echo "::warning::Could not delete $ref"
          done
