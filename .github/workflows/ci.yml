name: CI

on:
  pull_request:
    branches: [main]
    # Run on ready-for-review too (not a default type), so a draft flipped to
    # ready is checked immediately instead of waiting for the next push.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo. No token write scope.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, Build, Type Check, Test
    # A draft PR is work in progress, so skip CI until it's marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The integration phase runs the whole suite against a Postgres container on
    # the runner itself (the same image dev uses), so every query is a localhost
    # round-trip instead of an internet hop to a remote database. That removes
    # the ~15x per-query slowdown that used to push this job toward 15 minutes;
    # 10 minutes leaves comfortable headroom.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      # A prod deploy is a rolling update — the old instance keeps serving while
      # the new one boots — so a migration that drops/renames a column the old
      # version still reads breaks it mid-rollout. Fail a PR that adds a
      # non-backward-compatible migration unless it carries an `expand-contract:`
      # marker (docs/runbooks.md). Runs before install — needs only git + node.
      - name: Migration safety (expand-contract)
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          node scripts/check-migration-safety.mjs "origin/$GITHUB_BASE_REF"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan (secretlint)
        run: pnpm lint-secrets

      - name: Check (Biome + dprint)
        run: pnpm check

      - name: Check dependencies
        run: pnpm check-deps

      # An entry in pnpm-workspace.yaml's `overrides:` outranks every
      # package.json, so raising only the packages leaves the repo running the
      # old Effect while every manifest claims otherwise. The lockfile it
      # produces is self-consistent, so nothing above catches it — not syncpack,
      # which only reads package.json, and not --frozen-lockfile.
      - name: Check Effect pins agree
        run: pnpm check-effect-pins

      - name: Build
        run: pnpm build

      # Cloudflare rejects the batuda.co worker past a fixed compressed size,
      # and it does so at deploy time — on a release tag, once the tag is
      # already pushed. Catching it here points at the pull request that added
      # the weight instead. Measures what Build produced, so it runs after it.
      - name: Check worker bundle size
        run: node scripts/check-bundle-size.mjs

      # The TanStack Start Vite plugin (run by Build) is the single source of
      # truth for apps/internal/src/routeTree.gen.ts. If Build regenerated a
      # different tree, the committed one is stale — fail so it gets committed.
      - name: Verify route tree is up to date
        run: |
          git diff --exit-code -- apps/internal/src/routeTree.gen.ts \
            || { echo "::error::routeTree.gen.ts is stale — run 'pnpm build' and commit the regenerated file."; exit 1; }

      - name: Type check
        run: pnpm check-types

      # Themes are only as good as their contrast. The local pre-push hook runs
      # this too, but a hook can be skipped and CI cannot.
      - name: Check theme contrast
        run: pnpm --filter @batuda/ui check-contrast

      # Fast unit suite first — no external services needed. Any test that
      # touches Postgres lives under `*.integration.test.ts` and runs in
      # the integration phase below against the local Postgres container.
      - name: Test (unit)
        run: pnpm test

      # Integration phase: a local Postgres + MinIO on the runner, seed, and the
      # integration suite. Shared with the post-merge backstop in e2e-main.yml so
      # both stand the database up the same way — see the action for why.
      - name: Integration suite against a local Postgres
        uses: ./.github/actions/integration-db

      # Boot the built server against the REAL config.production.json + the
      # deploy workflow's exact `-e` secret list (dummy values), so a release
      # where the baked config needs a key the deploy never injects fails the
      # build instead of crashing on boot and taking prod down (2026-07-11).
      # Reuses the Postgres + MinIO the integration phase already stood up.
      - name: Test (deploy boot parity)
        env:
          DATABASE_URL: postgresql://batuda:batuda@localhost:5433/batuda
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY_ID: batuda
          STORAGE_SECRET_ACCESS_KEY: batuda-secret
          STORAGE_BUCKET: batuda-assets
        run: pnpm --filter @batuda/server exec vitest run src/main.boot.test.ts --config vitest.boot.config.ts

  # Browser-level smoke (sign-in + one read + one write) on its own runner, in
  # parallel with the job above so it never eats into that 10-minute budget. It
  # stands up its own Postgres + seed and serves the app under portless, so the
  # e2e database is isolated from the integration suite's truncations. Make this
  # a required status check so a red smoke run blocks the merge — the whole point
  # of the suite is to be the un-skippable browser gate (docs/runbooks.md). The
  # full suite runs post-merge in e2e-main.yml.
  e2e-smoke:
    name: E2E smoke (Playwright)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Stand up the stack and run the smoke subset
        uses: ./.github/actions/e2e-stack
        with:
          grep: "@smoke"
