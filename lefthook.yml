pre-commit:
  commands:
    check-deps:
      run: |
        pnpm check-deps
      stage_fixed: true

    check-types:
      run: |
        pnpm check-types

    lint:
      run: |
        pnpm lint-biome {staged_files}
      stage_fixed: true

    format-packages:
      run: |
        pnpm lint-syncpack
      stage_fixed: true

    format-markdown:
      glob: "**/*.md"
      run: |
        pnpm exec dprint fmt --config dprint.json --allow-no-files {staged_files}
      stage_fixed: true

    i18n-check:
      # Fires when any Lingui-touched file under a web app is staged. Runs
      # `i18n:check` in every workspace that defines it via pnpm's
      # `--if-present` filter — internal is the only web app here today, any
      # new web app tomorrow without editing this file.
      #
      # No `stage_fixed`: `i18n:check` is read-only (it verifies catalogs
      # are in sync, never writes). Auto-amending .po would silently stage
      # untranslated msgstr entries, which then ship as empty strings.
      glob: "apps/internal/**/*.{tsx,ts,po}"
      run: |
        pnpm -r --parallel --if-present run i18n:check

pre-push:
  commands:
    contrast:
      # The themes' contrast tables in docs/brand-visual.md drifted from the
      # code once already. This reads the real token file, so a colour that
      # slips below its WCAG target fails here instead of shipping.
      run: |
        pnpm --filter @batuda/ui check-contrast

    secrets:
      # Scan for leaked secrets before publishing to the PUBLIC repo.
      # GitHub push protection catches known token formats server-side;
      # this adds local pre-push coverage, incl. bespoke patterns defined
      # in .secretlintrc.json. .gitignore is respected by default;
      # .secretlintignore excludes vendored docs/repos and the lockfile.
      run: |
        pnpm lint-secrets

    test:
      # Unit suite AND the live-DB integration suite. `turbo test` alone runs
      # only the default config, which EXCLUDES `*.integration.test.ts`, so
      # schema bugs used to slip straight to CI; `test:integration` closes that.
      # It runs against a disposable integration DB that
      # scripts/integration-db-setup.ts creates, migrates to HEAD, and seeds —
      # named per checkout (`batuda_it`, or `batuda_it__<slug>` in a worktree) so
      # parallel worktrees don't race on one shared DB. `--concurrency=1`
      # serialises @batuda/server and @batuda/mail-worker, which share this
      # checkout's integration DB and TRUNCATE shared tables in beforeAll.
      run: |
        pnpm turbo test test:integration --concurrency=1

    e2e-smoke:
      # Browser-level smoke (sign-in + one read + one write, tagged @smoke) run
      # against your live `pnpm dev` stack — fast local feedback, the way the
      # integration suite runs here too. The CI `e2e-smoke` job is the
      # un-skippable gate; this hook is a bonus, so it SKIPS (never blocks a
      # push) when the dev stack isn't reachable or Chromium isn't installed.
      # `portless get batuda` resolves the right origin whether this is the main
      # checkout (batuda.localhost) or a worktree (<label>.batuda.localhost).
      # The tests read seeded rows straight from the database to assert against
      # what the page renders, so they need THIS checkout's database — a
      # worktree has its own, and without it the assertions compare the main
      # checkout's data to the worktree's screen.
      run: |
        url="$(pnpm exec portless get batuda 2>/dev/null)"
        if [ -z "$url" ] || ! curl -skf --max-time 3 -o /dev/null "$url/login"; then
          echo "skip: e2e smoke — dev stack not reachable (start it with 'pnpm dev'); CI will run it"
          exit 0
        fi
        if ! find "$HOME/Library/Caches/ms-playwright" "$HOME/.cache/ms-playwright" \
             -maxdepth 1 -name 'chromium-*' -print -quit 2>/dev/null | grep -q .; then
          echo "skip: e2e smoke — Chromium not installed (run 'pnpm --filter @batuda/internal exec playwright install chromium'); CI will run it"
          exit 0
        fi
        if [ -z "$E2E_DATABASE_URL" ] && [ -f .env ]; then
          E2E_DATABASE_URL="$(grep -m1 '^DATABASE_URL=' .env | cut -d= -f2- | tr -d '"'"'"'"')"
        fi
        E2E_BASE_URL="$url" E2E_DATABASE_URL="$E2E_DATABASE_URL" \
          pnpm --filter @batuda/internal exec playwright test --grep @smoke
